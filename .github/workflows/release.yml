name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust-targets: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ""
          - name: Windows
            platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Grok Mission Control v__VERSION__"
          releaseBody: |
            Grok Bot Hackathon Boston 10/09/2026

            Desktop installers:
            - macOS Apple silicon and Intel (.dmg)
            - Windows (.exe NSIS and .msi)
            - Linux (.deb and .AppImage)

            Chrome / browser: download `grok-mission-control-web.zip`, unzip, and serve the folder (`npx serve .`). Live Grok replies in the browser need `npm run dev` or the desktop app. The API key is entered in Settings and is never bundled.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  browser:
    name: Chrome / browser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build
          (cd dist && zip -r ../grok-mission-control-web.zip .)

      - name: Attach browser build to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Grok Mission Control ${tag}" \
              --notes "Grok Bot Hackathon Boston 10/09/2026. Desktop installers are attached by the platform builds. grok-mission-control-web.zip is the Chrome/browser build: unzip and serve the folder."
          fi
          gh release upload "$tag" grok-mission-control-web.zip --clobber
